name: Build libretro core (Windows + iOS, Mega Man widescreen)

on:
  push:
    branches:
      - 'megaman-widescreen'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-libretro:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build mesen2_libretro.dll
        run: |
          g++ --version
          make -f Makefile.libretro -j4 HAVE_LTO=0
          ls -la mesen2_libretro.dll
          objdump -p mesen2_libretro.dll | grep "DLL Name" || true

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: mesen2_libretro-megaman-widescreen-windows-x64
          path: mesen2_libretro.dll

      - name: Publish core to the megaman-widescreen-build branch
        shell: bash
        run: |
          mkdir published && cp mesen2_libretro.dll published/ && cd published
          git init -q -b megaman-widescreen-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesen2_libretro.dll
          git commit -q -m "Windows libretro core built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" megaman-widescreen-build

  ios-libretro:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build mesen2_libretro_ios.dylib (iOS arm64)
        run: |
          xcodebuild -version
          make -f Makefile.libretro -j4 platform=ios-arm64 HAVE_LTO=0
          ls -la mesen2_libretro_ios.dylib
          file mesen2_libretro_ios.dylib
          otool -L mesen2_libretro_ios.dylib
          otool -l mesen2_libretro_ios.dylib | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -12

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: mesen_libretro_ios-megaman-widescreen
          path: mesen2_libretro_ios.dylib

      - name: Put the core into the RetroArch nightly IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -L --fail -o RetroArch.ipa https://buildbot.libretro.com/nightly/apple/ios-arm64/RetroArch.ipa
          mkdir ipa && cd ipa && unzip -q ../RetroArch.ipa
          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"
          ls "$APP/Frameworks" | grep -i -E "mesen|nestopia|fceumm" || true
          FW="$APP/Frameworks/mesen.libretro.framework"
          if [ -d "$FW" ]; then
            echo "Replacing the stock Mesen core"
            cat "$FW/Info.plist" || true
          else
            echo "No stock Mesen core in this IPA; adding ours"
            mkdir -p "$FW"
            REF=$(ls -d "$APP"/Frameworks/*.libretro.framework | head -1)
            cp "$REF/Info.plist" "$FW/Info.plist"
            REFNAME=$(basename "$REF" .framework)
            plutil -convert xml1 "$FW/Info.plist"
            sed -i '' "s/$REFNAME/mesen.libretro/g" "$FW/Info.plist"
          fi
          rm -rf "$FW/_CodeSignature"
          cp ../mesen2_libretro_ios.dylib "$FW/mesen.libretro"
          chmod 755 "$FW/mesen.libretro"
          codesign --force --sign - "$FW"
          ls -la "$FW"
          zip -qry ../RetroArch-MegaMan-Widescreen.ipa Payload
          cd .. && ls -la RetroArch-MegaMan-Widescreen.ipa
          gh release delete megaman-widescreen-ios -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create megaman-widescreen-ios RetroArch-MegaMan-Widescreen.ipa mesen2_libretro_ios.dylib -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "RetroArch iOS nightly + Mesen with Mega Man widescreen" \
            --notes "RetroArch iOS nightly IPA with its Mesen core replaced by the build from this branch (Mega Man 1 widescreen). Not signed for distribution: install it with a sideloading tool (AltStore, SideStore, Sideloadly...), which signs it for your device."

      - name: Publish core to the megaman-widescreen-build-ios branch
        run: |
          mkdir published && cp mesen2_libretro_ios.dylib published/mesen_libretro_ios.dylib && cd published
          git init -q -b megaman-widescreen-build-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesen_libretro_ios.dylib
          git commit -q -m "iOS arm64 libretro core built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" megaman-widescreen-build-ios
